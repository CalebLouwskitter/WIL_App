name: Expo EAS Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: expo-eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Expo tooling
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Run Android EAS build
        run: eas build --platform android --non-interactive

  ios:
    name: iOS Build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Expo tooling
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Run iOS EAS build
        run: eas build --platform ios --non-interactive
